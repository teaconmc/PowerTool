    compileOnly("net.caffeinemc:sodium-neoforge-mod:0.8.12+mc26.1.2") // sodium mc26.1.2-0.8.12-neoforge
    compileOnly("maven.modrinth:YL57xq9U:YEGDGnJM") // iris 1.10.9+26.1-neoforge

    jarJar(implementation "eu.pb4:placeholder-api-neoforge:3.0.0+26.1+neoforge") {
        version {
            prefer "3.0.0"
        }
    }

    jarJar(implementation "com.xkball:xklib-3d:$xklib_version") {
        version {
            strictly "[$xklib_version, 1.0.0)"
            prefer xklib_version
        }
    }
    jarJar(implementation "com.xkball:xklib-ap:$xklib_version") {
        version {
            strictly "[$xklib_version, 1.0.0)"
            prefer xklib_version
        }
    }
    jarJar(implementation "com.xkball:xklib-ui:$xklib_version") {
        version {
            strictly "[$xklib_version, 1.0.0)"
            prefer xklib_version
        }
    }
    jarJar(implementation "com.xkball:xklib-mc:$xklib_version") {
        version {
            strictly "[$xklib_version, 1.0.0)"
            prefer xklib_version
        }
